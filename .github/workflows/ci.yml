name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # zero runtime dependencies: tests run with no npm install
      - run: node --test test/*.test.mjs
      - run: node bin/skill-audit.mjs test/fixtures --format text --fail-on none

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev --no-fund --no-audit
      - run: npm run typecheck

  self-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # dogfood: the scanner audits this repo's own agent files.
      # Deliberate corpus is suppressed per file in .github/self-audit-ignore.
      - run: node bin/skill-audit.mjs . --fail-on warning --ignore-file .github/self-audit-ignore --format sarif > skill-audit.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: skill-audit.sarif
